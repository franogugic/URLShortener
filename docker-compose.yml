services:
  mysql:
    image: mysql:8.0 # Fiksna verzija 8.0 je stabilnija za ovaj setup
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urlshortener
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: MojaJakaLozinka123!
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BASE_DOMAIN=http://116.203.122.236
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=urlshortener;user=admin_user;password=MojaJakaLozinka123!
      - Redis__ConnectionString=redis:6379
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql-data: